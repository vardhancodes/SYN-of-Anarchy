<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Raw Java Server</title>
    <style>
        body {
            background-color: #0d0d12;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #b026ff;
            text-shadow: 0 0 10px #b026ff, 0 0 20px #b026ff, 0 0 40px #b026ff;
            font-size: 3rem;
        }
        .status {
            border: 1px solid #00f3ff;
            color: #00f3ff;
            padding: 10px 20px;
            box-shadow: 0 0 10px #00f3ff;
        }
    </style>
</head>
<body>
    <h1>SERVER ACTIVE</h1>
    <div class="status">
        <p>200 OK - Multithreading Initialized</p>
    </div>
</body>
</html>
